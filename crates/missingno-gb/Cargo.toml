[package]
name = "missingno-gb"
version = "0.0.1"
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[features]
morepork = ["dep:morepork", "dep:sha2"]
test-support = ["dep:png"]

[dependencies]
missingno-debug = { path = "../missingno-debug" }
bitflags = { workspace = true }
rgb = { workspace = true }
morepork = { git = "https://github.com/ajoneil/morepork", optional = true }
sha2 = { version = "0.11", optional = true }
png = { version = "0.18", optional = true }

[dev-dependencies]
missingno-gb = { path = ".", features = ["test-support"] }
png = "0.18"
