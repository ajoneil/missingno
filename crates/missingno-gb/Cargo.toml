[package]
name = "missingno-gb"
version = "0.0.1"
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[features]
morepork = ["dep:morepork"]
test-support = ["dep:png"]

[dependencies]
missingno-core = { path = "../missingno-core" }
bitflags = { workspace = true }
rgb = { workspace = true }
# The trace format lives in its own repo (cloned into receipts/); the capture
# path depends on the in-tree engine so it and the core share one state
# vocabulary. Enabling `morepork` requires that clone to be present.
morepork = { path = "../../receipts/resources/morepork/crates/morepork", optional = true }
sha2 = { version = "0.11" }
png = { version = "0.18", optional = true }

[dev-dependencies]
missingno-gb = { path = ".", features = ["test-support"] }
png = "0.18"
