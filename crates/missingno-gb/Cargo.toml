[package]
name = "missingno-gb"
version.workspace = true
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[features]
morepork = ["dep:morepork"]
test-support = ["dep:png"]

[dependencies]
missingno-core = { path = "../missingno-core" }
bitflags = { workspace = true }
rgb = { workspace = true }
# The trace format lives in its own repo (cloned into receipts/); the capture
# sourced from the public repo so a fresh clone resolves without credentials;
# local morepork iteration lands by pushing there and `cargo update -p morepork`.
morepork = { git = "https://github.com/ajoneil/morepork", branch = "main", optional = true }
sha2 = { version = "0.11" }
png = { version = "0.18", optional = true }

[dev-dependencies]
missingno-gb = { path = ".", features = ["test-support"] }
png = "0.18"
