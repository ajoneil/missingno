[package]
name = "missingno-debugger"
version.workspace = true
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[[bin]]
name = "missingno-debugger"
path = "src/main.rs"

[features]
# The shipping cores. The Game Boy family ships both models — the cartridge
# header picks the core at construction — so `gb` pulls the shared base (gb)
# and the colour superset (gbc) together; there is no meaningful gb-without-gbc
# split for a build that must still run dual-mode media.
default = ["gb", "vcs"]
gb = ["missingno-session/gb"]
vcs = ["missingno-session/vcs"]
nes = ["missingno-session/nes"]
sms = ["missingno-session/sms"]
# The MCP-over-stdio transport, over the session's agent tool surface.
mcp = ["missingno-session/tools"]

[dependencies]
missingno-core = { path = "../missingno-core" }
missingno-session = { path = "../missingno-session", default-features = false }
tiny_http = "0.12"
rgb = { workspace = true }
serde_json = "1"
