[package]
name = "missingno-vcs"
version.workspace = true
edition = "2024"
license = "MIT"

[features]
morepork = ["dep:morepork", "dep:missingno-trace"]

[dependencies]
missingno-mos-6502 = { path = "../../chips/mos-6502" }
missingno-core = { path = "../../missingno/core" }
rgb = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The in-tree trace engine (cloned into receipts/), shared with the other cores
# so the whole workspace speaks one trace format. Requires that clone present.
morepork = { git = "https://github.com/ajoneil/morepork", branch = "main", optional = true }
missingno-trace = { path = "../../missingno/trace", optional = true }
sha2 = { version = "0.11" }

[dev-dependencies]
ron = "0.12"
missingno-test-support = { path = "../../missingno/test-support" }

[[example]]
name = "trace-from-state"
required-features = ["morepork"]
