[package]
name = "missingno-debugger"
version.workspace = true
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[[bin]]
name = "missingno-debugger"
path = "src/main.rs"

[features]
# The shipping cores. The Game Boy family ships both models — the cartridge
# header picks the core at construction — so `gb` pulls the shared base (gb)
# and the colour superset (gbc) together; there is no meaningful gb-without-gbc
# split for a build that must still run dual-mode media.
default = ["gb", "vcs", "sg1000"]
gb = ["missingno-session/gb"]
vcs = ["missingno-session/vcs"]
nes = ["missingno-session/nes"]
sms = ["missingno-session/sms"]
sg1000 = ["missingno-session/sg1000"]
# The MCP-over-stdio transport, over the session's agent tool surface, with
# the cores' trace-capture backends behind the capture_trace tool.
mcp = [
    "dep:missingno-mcp-stdio",
    "missingno-session/tools",
    "missingno-session/morepork",
]

[dependencies]
missingno-core = { path = "../core" }
missingno-session = { path = "../session", default-features = false }
missingno-mcp-stdio = { path = "../mcp-stdio", optional = true }
tiny_http = "0.12"
rgb = { workspace = true }
serde_json = "1"
