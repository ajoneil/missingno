[package]
name = "missingno"
version.workspace = true
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[[bin]]
name = "missingno"
path = "src/main.rs"

[features]
# Sega Master System support; off until it is ready to be public.
sms = ["dep:missingno-sms"]
# NES / Famicom support; off until it is ready to be public.
nes = ["dep:missingno-nes", "missingno-nes/morepork"]

[dependencies]
missingno-gamedb = { path = "../../../missingno-gamedb/crates/gamedb" }
missingno-core = { path = "../core" }
missingno-iced = { path = "../iced" }
missingno-gb = { path = "../../systems/gb", features = ["morepork"] }
missingno-gbc = { path = "../../systems/gbc", features = ["morepork"] }
missingno-nes = { path = "../../systems/nes", optional = true }
missingno-sg1000 = { path = "../../systems/sg1000" }
missingno-sms = { path = "../../systems/sms", optional = true }
missingno-vcs = { path = "../../systems/vcs", features = ["morepork"] }
missingno-session = { path = "../session", default-features = false, features = ["tools", "audio-output"] }
clap = { version = "4.6.4", features = ["derive"] }
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "smol", "svg", "wgpu"] }
rgb = { workspace = true }
rfd = "0.17.2"
gilrs = "0.11"
image = "0.25"
ron = "0.12"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
smol = "2"
ureq = "3"
zstd = "0.13"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
dirs = "6"
open = "5"
tar = "0.4"

[build-dependencies]
tar = "0.4"
zstd = "0.13"
