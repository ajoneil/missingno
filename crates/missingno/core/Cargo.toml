[package]
name = "missingno-core"
version.workspace = true
edition = "2024"

[features]
# The trace-container vocabulary: the column planning every core's capture
# bridge shares. Off by default so an embedder links no trace engine.
morepork = ["dep:morepork"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rgb = { workspace = true }
sha2 = { version = "0.11" }
morepork = { git = "https://github.com/ajoneil/morepork", branch = "main", optional = true }
