[package]
name = "missingno-session"
version.workspace = true
authors = ["Andrew O'Neil <andy@andyofniall.net>"]
edition = "2024"
license = "MIT"

[features]
audio-output = ["dep:cpal", "dep:rtrb"]
# The shipping cores. The Game Boy family ships both models — the cartridge
# header picks the core at construction — so `gb` pulls the shared base (gb)
# and the colour superset (gbc) together; there is no meaningful gb-without-gbc
# split for a build that must still run dual-mode media.
default = ["gb", "vcs"]
gb = ["dep:missingno-gb", "dep:missingno-gbc"]
vcs = ["dep:missingno-vcs"]
nes = ["dep:missingno-nes"]
sms = ["dep:missingno-sms"]
# The agent tool surface and the attach endpoint that publishes it. Pulls a
# PNG encoder for the frame tool.
tools = ["dep:png"]
# Trace-capture backends for the capture_trace tool: the morepork engine on
# whichever cores are enabled.
morepork = [
    "missingno-gb?/morepork",
    "missingno-gbc?/morepork",
    "missingno-vcs?/morepork",
    "missingno-nes?/morepork",
]

[dependencies]
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.3", optional = true }
missingno-core = { path = "../core" }
missingno-gb = { path = "../../systems/gb", optional = true }
missingno-gbc = { path = "../../systems/gbc", optional = true }
missingno-vcs = { path = "../../systems/vcs", optional = true }
missingno-nes = { path = "../../systems/nes", optional = true }
missingno-sms = { path = "../../systems/sms", optional = true }
serde_json = "1"
png = { version = "0.18", optional = true }

[target.'cfg(unix)'.dependencies]
# uid-scoping the attach runtime directory when XDG does not name one.
libc = "0.2"

