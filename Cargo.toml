[workspace]
resolver = "3"
# The gamedb submodule is its own workspace; keep its crates out of this one.
exclude = ["missingno-gamedb"]
members = [
    "crates/missingno",
    "crates/missingno-curator",
    "crates/missingno-debugger",
    "crates/missingno-remote",
    "crates/missingno-session",
    "crates/missingno-gb",
    "crates/missingno-gbc",
    "crates/missingno-core",
    "crates/missingno-iced",
    "crates/missingno-6502",
    "crates/missingno-nes",
    "crates/missingno-sms",
    "crates/missingno-vcs",
]
# The shipping set; the immature cores build only via -p.
default-members = [
    "crates/missingno",
    "crates/missingno-curator",
    "crates/missingno-debugger",
    "crates/missingno-remote",
    "crates/missingno-session",
    "crates/missingno-gb",
    "crates/missingno-gbc",
    "crates/missingno-core",
    "crates/missingno-iced",
    "crates/missingno-6502",
    "crates/missingno-vcs",
]

# One version for every library crate, so they cannot drift apart. The app sets
# its own — it ships to people and versions by calendar.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
bitflags = "2.11.1"
rgb = "0.8.53"

[profile.release]
lto = "fat"
codegen-units = 1

# Release codegen with debug symbols, for profiling.
[profile.profiling]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.missingno-gb]
opt-level = 1

[profile.dev.package.missingno-gbc]
opt-level = 1
