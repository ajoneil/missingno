[workspace]
resolver = "3"
# The gamedb submodule is its own workspace; keep its crates out of this one.
exclude = ["missingno-gamedb"]
members = [
    "crates/missingno/app",
    "crates/missingno/curator",
    "crates/missingno/debugger",
    "crates/missingno/remote",
    "crates/missingno/session",
    "crates/missingno/core",
    "crates/missingno/iced",
    "crates/systems/gb",
    "crates/systems/gbc",
    "crates/systems/nes",
    "crates/systems/sg1000",
    "crates/systems/sms",
    "crates/systems/vcs",
    "crates/chips/mos-6502",
    "crates/chips/ti-psg",
    "crates/chips/ti-vdp",
    "crates/chips/zilog-z80",
]
# The shipping set; the immature cores build only via -p.
default-members = [
    "crates/missingno/app",
    "crates/missingno/curator",
    "crates/missingno/debugger",
    "crates/missingno/remote",
    "crates/missingno/session",
    "crates/missingno/core",
    "crates/missingno/iced",
    "crates/systems/gb",
    "crates/systems/gbc",
    "crates/systems/vcs",
    "crates/chips/mos-6502",
    "crates/chips/ti-psg",
    "crates/chips/ti-vdp",
    "crates/chips/zilog-z80",
]

# One version for every crate, app included: the calendar release number of the
# release currently in development.
[workspace.package]
version = "26.9.0"

[workspace.dependencies]
bitflags = "2.13.1"
rgb = "0.8.53"

[profile.release]
lto = "fat"
codegen-units = 1

# Release codegen with debug symbols, for profiling.
[profile.profiling]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.missingno-gb]
opt-level = 1

[profile.dev.package.missingno-gbc]
opt-level = 1
