name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Test ROMs are committed; nothing here needs proprietary boot ROMs.

jobs:
  # The gate: both accuracy suites fully green. Any failure is a regression —
  # the suites have been at zero failures since 2026-07.
  core-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: DMG suite
        run: cargo test -p missingno-gb
      - name: CGB suite
        run: cargo test -p missingno-gbc

  # VCS core: the 6502 sweep runs against the SingleStepTests oracle
  # (fetched, not committed — 1.2 GB of per-cycle JSON).
  vcs-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SingleStepTests oracle
        run: ./scripts/fetch-single-step-tests.sh
      - name: VCS tests + 6502 oracle sweep
        run: cargo test -p missingno-vcs -- --include-ignored

  # The GUI crate compiles headlessly but needs audio/input/dialog system
  # libraries present to build on Linux.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (cpal, gilrs, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Build and unit tests
        run: cargo test -p missingno
      - name: Clippy (workspace, informational failures only on errors)
        run: cargo clippy --workspace
