name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Test ROMs are committed; nothing here needs proprietary boot ROMs.

jobs:
  # One job per workspace crate, named for the crate minus the missingno-
  # prefix. The gate everywhere: the crate's suite fully green; any failure
  # is a regression.
  #
  # Per-entry knobs:
  #   crate    — full package name when it isn't missingno-<name>
  #   flags    — extra cargo test flags (session's gate is --all-features;
  #              the debugger pairs with --features mcp for the transports)
  #   packages — apt packages for crates that link system libraries
  #   timeout  — minutes, when the default 30 isn't enough
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: missingno, crate: missingno, packages: libasound2-dev libudev-dev libgtk-3-dev }
          - { name: core }
          - { name: curator, packages: libasound2-dev libudev-dev }
          - { name: debugger, flags: --features mcp, packages: libasound2-dev }
          - { name: gb, timeout: 60 }
          - { name: gbc, timeout: 60 }
          - { name: iced }
          - { name: mcp-stdio }
          # The 6502 and Z80 sweeps run against the SingleStepTests oracles
          # (per-cycle JSON, gigabytes; the harnesses fetch them on first run).
          - { name: mos-6502 }
          - { name: nes }
          - { name: remote }
          - { name: session, flags: --all-features, packages: libasound2-dev }
          - { name: sg1000 }
          - { name: sms }
          - { name: test-support }
          - { name: ti-psg }
          - { name: ti-vdp }
          - { name: vcs }
          - { name: zilog-z80 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System libraries
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Test suite
        run: cargo test -p ${{ matrix.crate || format('missingno-{0}', matrix.name) }} ${{ matrix.flags }}

  # Formatting and lints across the whole workspace, plus the app's optional
  # feature configs. Clippy over the workspace needs the GUI system libraries.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System libraries (cpal, gilrs, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (workspace, informational failures only on errors)
        run: cargo clippy --workspace
      - name: Frontend feature configs build
        run: |
          cargo clippy -p missingno --features sms
          cargo clippy -p missingno --features nes
          cargo clippy -p missingno --features sms,nes
