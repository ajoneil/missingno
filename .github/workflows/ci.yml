name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Test ROMs are committed; nothing here needs proprietary boot ROMs.

jobs:
  # The gate: the DMG suite fully green. Any failure is a regression.
  gb-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: DMG suite
        run: cargo test -p missingno-gb

  # The gate: the CGB suite fully green. Any failure is a regression.
  gbc-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: CGB suite
        run: cargo test -p missingno-gbc

  # VCS core: the 6502 sweep runs against the SingleStepTests oracle
  # (fetched, not committed — 1.2 GB of per-cycle JSON).
  vcs-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SingleStepTests oracle
        run: ./scripts/fetch-single-step-tests.sh
      - name: 6502-family oracle sweeps
        run: cargo test -p missingno-6502 -- --include-ignored
      - name: VCS tests
        run: cargo test -p missingno-vcs
      - name: Fetch SingleStepTests z80 oracle
        run: ./scripts/fetch-single-step-tests-z80.sh
      - name: SMS tests + Z80 oracle sweep
        run: cargo test -p missingno-sms -- --include-ignored

  # The GUI crate compiles headlessly but needs audio/input/dialog system
  # libraries present to build on Linux.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (cpal, gilrs, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Build and unit tests
        run: cargo test -p missingno
      - name: Clippy (workspace, informational failures only on errors)
        run: cargo clippy --workspace
      - name: Frontend feature configs build
        run: |
          cargo clippy -p missingno --features sms
          cargo clippy -p missingno --features nes
          cargo clippy -p missingno --features sms,nes
